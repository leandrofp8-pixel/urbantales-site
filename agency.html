<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    /* Clickjacking defense: GitHub Pages can't send frame-ancestors headers,
       so this portal busts out of any iframe. */
    if (window.top !== window.self) { window.top.location = window.self.location; }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitleTag">Agency Portal — Urban Tales</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="icon.png">
  <!-- QR generation for voucher codes -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .auth-card {
      background: linear-gradient(180deg, var(--card-strong), var(--card));
      border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 2.2rem; width: 100%; max-width: 430px;
    }
    .auth-logo { text-align: center; margin-bottom: 1.6rem; }
    .auth-logo img.brand-icon { width: 52px; height: 52px; object-fit: contain; display: block; margin: 0 auto .5rem; border-radius: 12px; }
    .auth-logo p { color: var(--muted); font-size: .88rem; margin: 0; }
    .auth-card h2 { font-size: 1.3rem; margin-bottom: 1.4rem; text-align: center; }

    .field { display: flex; flex-direction: column; gap: .4rem; margin-bottom: 1rem; }
    .field label { font-size: .76rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
    .field input, .field select {
      background: rgba(0,0,0,.35); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: .95rem;
      padding: 12px 14px; outline: none; font-family: inherit; transition: border-color .15s;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }

    .btn-primary {
      width: 100%; padding: 13px; border: 0; border-radius: 999px; cursor: pointer;
      background: var(--accent); color: #241407; font-weight: 700; font-size: .95rem; font-family: inherit;
    }
    .btn-primary:hover { background: var(--accent-strong); }
    .btn-primary[disabled] { opacity: .6; cursor: default; }
    .btn-ghost {
      background: transparent; border: 1px solid var(--border); color: var(--text);
      border-radius: 999px; padding: 9px 16px; cursor: pointer; font-family: inherit; font-size: .85rem;
    }
    .btn-ghost:hover { border-color: var(--accent); }
    .link-row { text-align: center; margin-top: 1rem; font-size: .85rem; }
    .link-row a { color: var(--accent); cursor: pointer; text-decoration: none; }
    .msg { font-size: .85rem; margin-top: .8rem; text-align: center; min-height: 1.1em; }
    .msg.err { color: #ff9d8a; }
    .msg.ok { color: #9be3b4; }

    /* ── LANGUAGE SWITCH ── */
    .lang-switch { position: fixed; top: 14px; right: 14px; display: flex; gap: 4px; z-index: 200; }
    .lang-switch button {
      background: rgba(0,0,0,.4); border: 1px solid var(--border); color: var(--muted);
      font-size: .68rem; font-weight: 700; padding: 5px 9px; border-radius: 999px;
      cursor: pointer; font-family: inherit; letter-spacing: .03em;
    }
    .lang-switch button.active { background: var(--accent); color: #241407; border-color: var(--accent); }
    .lang-switch button:hover:not(.active) { color: var(--text); border-color: var(--accent); }

    /* ── PORTAL ── */
    .portal { display: none; max-width: var(--max); margin: 0 auto; padding: 1.5rem; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.6rem; }
    .topbar h1 { font-size: 1.25rem; margin: 0; }
    .topbar .sub { color: var(--muted); font-size: .85rem; margin-top: .2rem; }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .9rem; margin-bottom: 1.6rem; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.1rem 1.2rem; }
    .stat .n { font-size: 1.7rem; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .stat .n.accent { color: var(--accent); }
    .stat .l { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-top: .3rem; }

    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 1.4rem; margin-bottom: 1.4rem; }
    .panel h3 { font-size: 1rem; margin: 0 0 .3rem; }
    .panel .hint { color: var(--muted); font-size: .82rem; margin-bottom: 1.1rem; line-height: 1.6; }

    .issue-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .8rem; align-items: end; }
    .issue-grid .field { margin-bottom: 0; }
    .issue-grid button { padding: 12px 18px; }

    .codes { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .6rem; }
    .code-chip {
      font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 1rem; letter-spacing: 2px;
      background: rgba(0,0,0,.4); border: 1px solid var(--border); color: var(--accent);
      padding: 8px 13px; border-radius: 10px;
    }
    .issued-box { margin-top: 1rem; padding: 1rem 1.1rem; background: rgba(0,0,0,.25); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 0 12px 12px 0; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .87rem; }
    th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
    tr:last-child td { border-bottom: 0; }
    .num { font-variant-numeric: tabular-nums; }
    .pill { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .pill.issued { background: rgba(226,165,107,.16); color: var(--accent); }
    .pill.redeemed { background: rgba(155,227,180,.14); color: #9be3b4; }
    .pill.cancelled { background: rgba(255,255,255,.07); color: var(--muted); }
    .pill.paid { background: rgba(155,227,180,.14); color: #9be3b4; }
    .pill.open { background: rgba(226,165,107,.16); color: var(--accent); }
    .pill.overdue { background: rgba(255,157,138,.14); color: #ff9d8a; }
    .row-btn { font-size: .75rem; padding: 5px 11px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-family: inherit; }
    .row-btn:hover { border-color: var(--accent); color: var(--text); }
    .empty { text-align: center; color: var(--muted); padding: 1.4rem; }

    /* ── QR + VOUCHER ── */
    .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .9rem; margin-top: .9rem; }
    .voucher {
      background: #fff; color: #111; border-radius: 14px; padding: 1rem; text-align: center;
    }
    .voucher img { width: 100%; max-width: 150px; height: auto; image-rendering: pixelated; display: block; margin: 0 auto .6rem; }
    .voucher .vcode { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 1.05rem; font-weight: 700; letter-spacing: 2px; }
    .voucher .vmeta { font-size: .72rem; color: #555; margin-top: .3rem; line-height: 1.4; }
    .voucher .vbrand { font-size: .64rem; color: #888; margin-top: .5rem; text-transform: uppercase; letter-spacing: .08em; }
    .voucher .vlink { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .58rem; color: #999; margin-top: .4rem; word-break: break-all; }

    .link-list { display: flex; flex-direction: column; gap: .5rem; margin-top: .4rem; }
    .link-row-item { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .link-text { font-size: .78rem; color: var(--muted); word-break: break-all; }

    /* ── MODAL ── */
    .modal-back {
      position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none;
      align-items: center; justify-content: center; padding: 1.5rem; z-index: 100;
    }
    .modal-back.open { display: flex; }
    .modal {
      background: var(--bg-soft); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.6rem; width: 100%; max-width: 420px; box-shadow: var(--shadow);
    }
    .modal h4 { margin: 0 0 1.1rem; font-size: 1.05rem; }
    .modal-actions { display: flex; gap: .6rem; margin-top: 1.2rem; }
    .modal-actions button { flex: 1; }

    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; inset: 0; padding: 12mm; background: #fff; }
      .qr-grid { grid-template-columns: repeat(3, 1fr); }
      .voucher { border: 1px solid #ddd; break-inside: avoid; }
    }
  </style>
</head>
<body>

  <div class="lang-switch" id="langSwitch">
    <button data-lang="en">EN</button>
    <button data-lang="pt-BR">PT</button>
    <button data-lang="es">ES</button>
    <button data-lang="fr">FR</button>
    <button data-lang="de">DE</button>
  </div>

  <!-- ── LOGIN ── -->
  <div class="auth-wrap" id="loginScreen">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="icon.png" class="brand-icon" alt="Urban Tales" />
        <p data-i18n="portalTagline">Agency Portal</p>
      </div>
      <h2 id="authTitle">Sign in</h2>

      <div id="loginForm">
        <div class="field"><label for="li_email" data-i18n="emailLabel">Email</label><input id="li_email" type="email" autocomplete="username" /></div>
        <div class="field"><label for="li_pass" data-i18n="passwordLabel">Password</label><input id="li_pass" type="password" autocomplete="current-password" /></div>
        <button class="btn-primary" id="loginBtn" onclick="doLogin()" data-i18n="loginBtn">Sign in</button>
        <div class="msg" id="loginMsg"></div>
        <div class="link-row"><a onclick="showForgot()" data-i18n="forgotLink">Forgot my password</a></div>
        <div class="link-row"><span data-i18n="noAccountText">Don't have an account yet?</span> <a onclick="showRegister()" data-i18n="registerLink">Register your agency</a></div>
      </div>

      <div id="registerForm" style="display:none">
        <div class="field"><label for="rg_company" data-i18n="companyLabel">Agency</label><input id="rg_company" /></div>
        <div class="field"><label for="rg_name" data-i18n="yourNameLabel">Your name</label><input id="rg_name" /></div>
        <div class="field"><label for="rg_email" data-i18n="emailLabel">Email</label><input id="rg_email" type="email" /></div>
        <div class="field"><label for="rg_phone" data-i18n="phoneLabel">Phone</label><input id="rg_phone" /></div>
        <div class="field"><label for="rg_pass" data-i18n="passwordLabel">Password</label><input id="rg_pass" type="password" autocomplete="new-password" /></div>
        <button class="btn-primary" id="regBtn" onclick="doRegister()" data-i18n="registerBtn">Submit application</button>
        <div class="msg" id="regMsg"></div>
        <div class="link-row"><a onclick="showLogin()" data-i18n="backToLogin">Back to sign in</a></div>
      </div>

      <div id="forgotForm" style="display:none">
        <div class="field"><label for="fg_email" data-i18n="emailLabel">Email</label><input id="fg_email" type="email" /></div>
        <button class="btn-primary" onclick="doForgot()" data-i18n="sendResetLinkBtn">Send reset link</button>
        <div class="msg" id="forgotMsg"></div>
        <div class="link-row"><a onclick="showLogin()" data-i18n="backToLogin">Back to sign in</a></div>
      </div>

      <div id="resetForm" style="display:none">
        <div class="field"><label for="rs_pass" data-i18n="newPasswordLabel">New password</label><input id="rs_pass" type="password" autocomplete="new-password" /></div>
        <button class="btn-primary" onclick="doReset()" data-i18n="savePasswordBtn">Save new password</button>
        <div class="msg" id="resetMsg"></div>
      </div>
    </div>
  </div>

  <!-- ── PORTAL ── -->
  <div class="portal" id="portal">
    <div class="topbar">
      <div>
        <h1 id="agencyName">—</h1>
        <div class="sub" id="agencySub">—</div>
      </div>
      <button class="btn-ghost" onclick="logout()" data-i18n="logoutBtn">Log out</button>
    </div>

    <div class="cards" id="statCards"></div>

    <div class="panel">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem">
        <h3 style="margin:0" data-i18n="billingTitle">Billing</h3>
        <input id="billingMonth" type="month" onchange="loadBilling()" style="background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:8px 11px;font-family:inherit;font-size:.85rem" />
      </div>
      <div id="billingBody"><div class="empty" data-i18n="loadingText">Loading…</div></div>
    </div>

    <div class="panel">
      <h3 data-i18n="issueTitle">Issue Trip Pass</h3>
      <div class="hint">
        <span id="issueHintText"></span>
      </div>
      <div class="issue-grid">
        <div class="field"><label for="is_traveler" data-i18n="travelerOptionalLabel">Traveler (optional)</label><input id="is_traveler" data-i18n-placeholder="travelerNamePlaceholder" placeholder="Traveler's name" /></div>
        <div class="field"><label for="is_email" data-i18n="travelerEmailOptionalLabel">Traveler's email (optional)</label><input id="is_email" type="email" data-i18n-placeholder="travelerEmailPlaceholder" placeholder="to send the code" /></div>
        <div class="field"><label for="is_start" data-i18n="tripStartLabel">Trip start date</label><input id="is_start" type="date" /></div>
        <div class="field"><label for="is_days" data-i18n="daysLabel">Days</label><input id="is_days" type="number" min="1" max="60" value="7" /></div>
        <div class="field"><label for="is_qty" data-i18n="qtyLabel">Quantity</label><input id="is_qty" type="number" min="1" max="100" value="1" /></div>
        <button class="btn-primary" id="issueBtn" onclick="issuePasses()" data-i18n="issueBtn">Issue</button>
      </div>
      <label style="display:flex;align-items:center;gap:.5rem;margin-top:.9rem;font-size:.82rem;color:var(--muted);cursor:pointer">
        <input type="checkbox" id="is_send" style="width:16px;height:16px;accent-color:var(--accent)" />
        <span data-i18n="sendEmailCheckboxLabel">Email the code to the traveler (only for 1 pass with an email entered)</span>
      </label>
      <div id="issueResult"></div>
    </div>

    <div class="panel">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem">
        <h3 style="margin:0" data-i18n="issuedPassesTitle">Issued passes</h3>
        <div style="display:flex;gap:.5rem;align-items:center">
          <input id="filterMonth" type="month" onchange="loadPasses()" style="background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:8px 11px;font-family:inherit;font-size:.85rem" />
          <button class="btn-ghost" onclick="loadPasses()" data-i18n="refreshBtn">Refresh</button>
          <button class="btn-ghost" onclick="exportCsv()" data-i18n="exportCsvBtn">Export CSV</button>
          <button class="btn-ghost" onclick="printAllVouchers()" data-i18n="printVouchersBtn">Print vouchers</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th data-i18n="codeHeader">Code</th><th data-i18n="travelerHeader">Traveler</th><th data-i18n="tripHeader">Trip</th><th data-i18n="statusHeader">Status</th><th data-i18n="valueHeader">Value</th><th></th>
          </tr></thead>
          <tbody id="passBody"><tr><td colspan="6" class="empty" data-i18n="loadingText">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

const DATE_LOCALE = { en: 'en-US', 'pt-BR': 'pt-BR', es: 'es-ES', fr: 'fr-FR', de: 'de-DE' };

function detectLang() {
  const saved = localStorage.getItem('ag_lang');
  if (saved && STRINGS[saved]) return saved;
  const params = new URLSearchParams(location.search);
  const paramLang = params.get('lang');
  if (paramLang && STRINGS[paramLang]) return paramLang;
  const nav = navigator.language || 'en';
  const exact = Object.keys(STRINGS).find(k => k.toLowerCase() === nav.toLowerCase());
  if (exact) return exact;
  const prefix = nav.split('-')[0].toLowerCase();
  const prefixMatch = Object.keys(STRINGS).find(k => k.toLowerCase().startsWith(prefix));
  return prefixMatch || 'en';
}

let LANG = detectLang();
let s = STRINGS[LANG];

// Simple {key} interpolation — no pluralization engine needed for this page's vocabulary.
function fmt(str, vars) {
  return str.replace(/\{(\w+)\}/g, (_, k) => (vars[k] != null ? vars[k] : ''));
}

// Word-form plural (not suffix concatenation) — German especially has irregular
// plurals (Tag→Tage, Pass→Pässe) that a "+s" suffix can't produce correctly.
function pl(n, singular, plural) { return n === 1 ? singular : plural; }

const TITLE_KEYS = { loginForm: 'authTitleLogin', registerForm: 'authTitleRegister', forgotForm: 'authTitleForgot', resetForm: 'authTitleReset' };
let _currentAuthForm = 'loginForm';

function applyStaticStrings() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (s[key] != null) el.textContent = s[key];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.dataset.i18nPlaceholder;
    if (s[key] != null) el.placeholder = s[key];
  });
  document.getElementById('authTitle').textContent = s[TITLE_KEYS[_currentAuthForm]];
  document.getElementById('pageTitleTag').textContent = s.pageTitle;
  document.title = s.pageTitle;
  document.querySelectorAll('.lang-switch button').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
}

function setLang(lang) {
  if (!STRINGS[lang]) return;
  LANG = lang;
  s = STRINGS[lang];
  localStorage.setItem('ag_lang', lang);
  document.documentElement.lang = lang;
  applyStaticStrings();
  // Re-render whatever dynamic content is currently on screen, in the new language.
  if (document.getElementById('portal').style.display !== 'none') {
    loadPasses();
    loadBilling();
  }
}

document.querySelectorAll('.lang-switch button').forEach(b => {
  b.addEventListener('click', () => setLang(b.dataset.lang));
});

function show(id) {
  ['loginForm', 'registerForm', 'forgotForm', 'resetForm'].forEach(f => {
    document.getElementById(f).style.display = f === id ? 'block' : 'none';
  });
}
function setTitle(id) { _currentAuthForm = id; document.getElementById('authTitle').textContent = s[TITLE_KEYS[id]]; }
function showLogin()    { show('loginForm');    setTitle('loginForm'); }
function showRegister() { show('registerForm'); setTitle('registerForm'); }
function showForgot()   { show('forgotForm');   setTitle('forgotForm'); }

async function doLogin() {
  const btn = document.getElementById('loginBtn'), msg = document.getElementById('loginMsg');
  const email = document.getElementById('li_email').value.trim();
  const password = document.getElementById('li_pass').value;
  if (!email || !password) { msg.className = 'msg err'; msg.textContent = s.fillEmailPassword; return; }
  btn.disabled = true; msg.className = 'msg'; msg.textContent = s.loggingIn;
  try {
    const res = await fetch(`${API}/agency/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    if (res.status === 403) { msg.className = 'msg err'; msg.textContent = s.pendingApproval; return; }
    if (!res.ok) { msg.className = 'msg err'; msg.textContent = s.invalidCreds; return; }
    const d = await res.json();
    localStorage.setItem('ag_token', d.access_token);
    localStorage.setItem('ag_name', d.company || d.name || '');
    enterPortal();
  } catch (e) {
    msg.className = 'msg err'; msg.textContent = s.connError;
  } finally { btn.disabled = false; }
}

async function doRegister() {
  const btn = document.getElementById('regBtn'), msg = document.getElementById('regMsg');
  const body = {
    company: document.getElementById('rg_company').value.trim(),
    name: document.getElementById('rg_name').value.trim(),
    email: document.getElementById('rg_email').value.trim(),
    phone: document.getElementById('rg_phone').value.trim(),
    password: document.getElementById('rg_pass').value,
  };
  if (!body.name || !body.email || !body.password) { msg.className = 'msg err'; msg.textContent = s.fillNameEmailPassword; return; }
  btn.disabled = true; msg.className = 'msg'; msg.textContent = s.sending;
  try {
    const res = await fetch(`${API}/agency/register`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      msg.className = 'msg err'; msg.textContent = d.detail || s.registerFailed; return;
    }
    msg.className = 'msg ok';
    msg.textContent = s.registerSuccess;
  } catch (e) { msg.className = 'msg err'; msg.textContent = s.connError; }
  finally { btn.disabled = false; }
}

async function doForgot() {
  const msg = document.getElementById('forgotMsg');
  const email = document.getElementById('fg_email').value.trim();
  if (!email) { msg.className = 'msg err'; msg.textContent = s.enterEmail; return; }
  await fetch(`${API}/agency/forgot-password`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }),
  }).catch(() => {});
  // Always the same response, so the form can't be used to discover which emails exist.
  msg.className = 'msg ok';
  msg.textContent = s.resetLinkSent;
}

async function doReset() {
  const msg = document.getElementById('resetMsg');
  const token = new URLSearchParams(location.search).get('reset_token');
  const pass = document.getElementById('rs_pass').value;
  if (!pass || pass.length < 6) { msg.className = 'msg err'; msg.textContent = s.passwordMinLength; return; }
  try {
    const res = await fetch(`${API}/agency/reset-password`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, new_password: pass }),
    });
    if (!res.ok) { msg.className = 'msg err'; msg.textContent = s.invalidResetLink; return; }
    msg.className = 'msg ok'; msg.textContent = s.passwordChanged;
    setTimeout(() => { location.href = 'agency.html'; }, 1600);
  } catch (e) { msg.className = 'msg err'; msg.textContent = s.connError; }
}

function logout() { localStorage.removeItem('ag_token'); location.reload(); }

async function api(path, opts = {}) {
  const res = await fetch(`${API}${path}`, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${tok()}`, ...(opts.headers || {}) },
  });
  if (res.status === 401 || res.status === 403) { logout(); throw new Error('unauthorized'); }
  if (!res.ok) {
    const d = await res.json().catch(() => ({}));
    const det = d.detail;
    throw new Error((det && (det.message || det)) || `Error ${res.status}`);
  }
  return res.json();
}

function enterPortal() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('portal').style.display = 'block';
  document.getElementById('agencyName').textContent = localStorage.getItem('ag_name') || s.yourAgencyFallback;
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('is_start').value = today;
  document.getElementById('is_start').min = today;
  loadPasses();
  loadBilling();
}

// ══════════════════════════════════════════════
// BILLING
// ══════════════════════════════════════════════
function monthLabel(yyyyMm) {
  const [y, m] = yyyyMm.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString(DATE_LOCALE[LANG], { month: 'long', year: 'numeric' });
}

function dueInLabel(dueDateStr) {
  const due = new Date(dueDateStr + 'T00:00:00');
  const diffDays = Math.ceil((due - new Date()) / 86400000);
  if (diffDays <= 0) return s.dueToday;
  if (diffDays === 1) return s.dueTomorrow;
  return fmt(s.dueInDays, { n: diffDays });
}

async function loadBilling() {
  const el = document.getElementById('billingBody');
  const monthInput = document.getElementById('billingMonth');
  try {
    const d = await api(`/agency/billing${monthInput.value ? `?month=${monthInput.value}` : ''}`);
    if (!monthInput.value) monthInput.value = d.month;

    const STATUS_LABEL = {
      paid: d.paid_at ? fmt(s.statusPaidOn, { date: new Date(d.paid_at).toLocaleDateString(DATE_LOCALE[LANG]) }) : s.statusPaid,
      overdue: s.statusOverdue,
      open: dueInLabel(d.due_date),
    };

    const rows = (d.passes || []).map(p => `
      <tr>
        <td><code style="font-family:ui-monospace,Menlo,monospace;color:var(--accent);letter-spacing:1px;font-size:.82rem">${p.code}</code></td>
        <td>${p.traveler_name || '—'}</td>
        <td style="color:var(--muted)">${p.start_date} · ${p.days}d</td>
        <td class="num">${usd(p.net_cents)}</td>
      </tr>`).join('') || `<tr><td colspan="4" class="empty">${s.noBillablePasses}</td></tr>`;

    el.innerHTML = `
      <div style="display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap;margin-bottom:.3rem">
        <div style="font-size:2rem;font-weight:800">${usd(d.amount_cents)}</div>
        <span class="pill ${d.status}">${STATUS_LABEL[d.status]}</span>
      </div>
      <div style="color:var(--muted);font-size:.82rem;margin-bottom:1rem">
        ${fmt(s.tripsStartingIn, { month: monthLabel(d.month), date: new Date(d.due_date + 'T00:00:00').toLocaleDateString(DATE_LOCALE[LANG]) })}
      </div>
      <div class="cards" style="margin-bottom:1rem">
        <div class="stat"><div class="n">${d.billable_count}</div><div class="l">${s.billableStat}</div></div>
        <div class="stat"><div class="n">${d.traveler_days}</div><div class="l">${s.travelerDaysStat}</div></div>
        <div class="stat"><div class="n">${d.cancelled_count}</div><div class="l">${s.cancelledNotBilledStat}</div></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>${s.codeHeader}</th><th>${s.travelerHeader}</th><th>${s.tripStartHeader}</th><th>${s.valueHeader}</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty" style="color:#ff9d8a">${e.message}</div>`;
  }
}

// ══════════════════════════════════════════════
// ISSUE / LIST PASSES
// ══════════════════════════════════════════════
async function issuePasses() {
  const btn = document.getElementById('issueBtn');
  const out = document.getElementById('issueResult');
  const start = document.getElementById('is_start').value;
  const days = parseInt(document.getElementById('is_days').value, 10);
  const qty = parseInt(document.getElementById('is_qty').value, 10) || 1;
  const traveler = document.getElementById('is_traveler').value.trim();
  if (!start || !days) { out.innerHTML = `<div class="msg err">${s.fillStartDaysError}</div>`; return; }
  btn.disabled = true; out.innerHTML = `<div class="msg">${s.issuing}</div>`;
  try {
    const r = await api('/agency/trip-passes', {
      method: 'POST',
      body: JSON.stringify({
        start_date: start, days, quantity: qty,
        traveler_name: traveler || null,
        traveler_email: document.getElementById('is_email').value.trim() || null,
        send_email: document.getElementById('is_send').checked,
      }),
    });
    out.innerHTML = `<div class="issued-box">
      <div style="font-weight:700;margin-bottom:.5rem">${fmt(s.issuedResultLabel, { n: r.issued, passWord: pl(r.issued, s.passSingular, s.passPlural), adjS: r.issued !== 1 ? 's' : '', amount: usd(r.total_net_cents), emailSuffix: r.emailed ? s.emailSentSuffix : '' })}</div>
      <div class="link-list">${r.passes.map(p => `
        <div class="link-row-item">
          <span class="code-chip">${p.code}</span>
          <code class="link-text">${REDEEM_BASE}${p.code}</code>
          <button class="row-btn" onclick="copyLink('${p.code}', this)">${s.copyLinkBtn}</button>
          <button class="row-btn" onclick="shareWhatsApp('${p.code}')">${s.whatsappBtn}</button>
        </div>`).join('')}</div>
      <button class="btn-ghost" style="margin-top:.8rem" onclick="showQr(${JSON.stringify(r.passes.map(p => p.code)).replace(/"/g, '&quot;')},'${s.newlyIssuedVouchers}')">${s.viewQrPrintBtn}</button>
    </div>`;
    document.getElementById('is_traveler').value = '';
    document.getElementById('is_email').value = '';
    loadPasses();
  } catch (e) {
    out.innerHTML = `<div class="msg err">${e.message}</div>`;
  } finally { btn.disabled = false; }
}

async function loadPasses() {
  const body = document.getElementById('passBody');
  const month = document.getElementById('filterMonth').value;
  try {
    const d = await api(`/agency/trip-passes${month ? `?month=${month}` : ''}`);
    _lastPasses = d.passes || [];
    document.getElementById('issueHintText').textContent = fmt(s.issueHint, { rate: usd(d.rate_cents_per_day) });
    // Honour server-side duration limits in the form too, so the agency sees them.
    const daysInput = document.getElementById('is_days');
    if (d.min_days) daysInput.min = d.min_days;
    if (d.max_days) daysInput.max = d.max_days;
    document.getElementById('agencySub').textContent = fmt(s.ratePerTravelerDay, { rate: usd(d.rate_cents_per_day) });
    document.getElementById('statCards').innerHTML = `
      <div class="stat"><div class="n accent">${usd(d.billable_net_cents)}</div><div class="l">${s.billableStat}</div></div>
      <div class="stat"><div class="n">${d.billable_count}</div><div class="l">${s.issuedPassesTitle}</div></div>
      <div class="stat"><div class="n">${d.redeemed_count}</div><div class="l">${s.pillRedeemed}</div></div>
      <div class="stat"><div class="n">${d.cancelled_count}</div><div class="l">${s.pillCancelled}</div></div>`;

    const LBL = { issued: s.pillIssued, redeemed: s.pillRedeemed, cancelled: s.pillCancelled };
    body.innerHTML = (d.passes || []).map(p => {
      const editable = p.status === 'issued';
      return `<tr>
        <td><code style="color:var(--accent);letter-spacing:1px">${p.code}</code></td>
        <td>${p.traveler_name || '—'}</td>
        <td style="color:var(--muted)">${p.start_date} · ${p.days}d</td>
        <td><span class="pill ${p.status}">${LBL[p.status] || p.status}</span></td>
        <td class="num">${usd(p.net_cents)}</td>
        <td style="white-space:nowrap">
          <button class="row-btn" onclick="copyLink('${p.code}', this)">${s.linkBtn}</button>
          <button class="row-btn" onclick="shareWhatsApp('${p.code}')">${s.whatsappBtn}</button>
          <button class="row-btn" onclick="showQr(['${p.code}'],'${s.vouchersTitle} ${p.code}')">${s.qrBtn}</button>
          ${p.status !== 'cancelled' ? `<button class="row-btn" onclick="sendPassEmail('${p.code}')">${p.emailed_at ? s.resendBtn : s.sendBtn}</button>` : ''}
          ${editable
            ? `<button class="row-btn" onclick="openEdit('${p.code}')">${s.editBtn}</button>
               <button class="row-btn" onclick="cancelPass('${p.code}')">${s.cancelBtn}</button>` : ''}</td>
      </tr>`;
    }).join('') || `<tr><td colspan="6" class="empty">${s.noPassesYet}</td></tr>`;
  } catch (e) {
    body.innerHTML = `<tr><td colspan="6" class="empty" style="color:#ff9d8a">${e.message}</td></tr>`;
  }
}

async function sendPassEmail(code) {
  const p = _lastPasses.find(x => x.code === code) || {};
  let email = p.traveler_email || '';
  // Ask only when we don't already have an address on the pass.
  if (!email) {
    email = prompt(fmt(s.promptTravelerEmail, { code }), '');
    if (email === null) return;
    email = email.trim();
    if (!email) return;
  } else if (!confirm(fmt(s.confirmSendEmail, { action: p.emailed_at ? s.actionResend : s.actionSend, code, email }))) {
    return;
  }
  try {
    const r = await api(`/agency/trip-passes/${encodeURIComponent(code)}/send-email`, {
      method: 'POST', body: JSON.stringify({ email: email || null }),
    });
    alert(fmt(s.codeSentAlert, { email: r.sent_to }));
    loadPasses();
  } catch (e) { alert(e.message); }
}

async function cancelPass(code) {
  if (!confirm(fmt(s.confirmCancelPass, { code }))) return;
  try { await api(`/agency/trip-passes/${encodeURIComponent(code)}/cancel`, { method: 'POST' }); loadPasses(); }
  catch (e) { alert(e.message); }
}

// ── QR vouchers ────────────────────────────────────────────────
const REDEEM_BASE = 'https://urbantales.net/redeem?code=';

// Copy the redeem link — the fastest path for a traveller who already has a
// phone in hand, no QR scan or app-store detour needed.
async function copyLink(code, btn) {
  const url = REDEEM_BASE + code;
  try {
    await navigator.clipboard.writeText(url);
  } catch (e) {
    // Clipboard API needs a secure context / permission; fall back to a manual copy.
    prompt(s.copyLinkPrompt, url);
    return;
  }
  if (btn) {
    const prev = btn.textContent;
    btn.textContent = s.copiedBtnLabel;
    setTimeout(() => { btn.textContent = prev; }, 1400);
  }
}

// Opens WhatsApp (app on mobile, Web on desktop) with the message pre-filled —
// the agency still picks the contact and hits send.
function shareWhatsApp(code) {
  const p = _lastPasses.find(x => x.code === code);
  const url = REDEEM_BASE + code;
  const trip = p ? fmt(s.whatsappTripSuffix, { date: p.start_date, days: p.days, dayWord: pl(p.days, s.daySingular, s.dayPlural) }) : '';
  const text = fmt(s.whatsappMessage, { trip, url });
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
}

function qrDataUrl(text, cell = 5) {
  // qrcode-generator: type 0 = auto-size, 'M' = medium error correction,
  // which survives being printed small on a voucher.
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  return qr.createDataURL(cell, 2);
}

function voucherHtml(p) {
  const url = REDEEM_BASE + encodeURIComponent(p.code);
  return `<div class="voucher">
    <img src="${qrDataUrl(url)}" alt="QR ${p.code}" />
    <div class="vcode">${p.code}</div>
    <div class="vmeta">${p.traveler_name ? p.traveler_name + '<br>' : ''}${p.start_date} · ${p.days} ${pl(p.days, s.daySingular, s.dayPlural)}</div>
    <div class="vlink">${url}</div>
    <div class="vbrand">Urban Tales · Trip Pass</div>
  </div>`;
}

let _lastPasses = [];

function showQr(codes, title) {
  const list = _lastPasses.filter(p => codes.includes(p.code));
  if (!list.length) return;
  document.getElementById('qr_title').textContent = title || fmt(s.vouchersCountTitle, { n: list.length });
  document.getElementById('qr_grid').innerHTML = list.map(voucherHtml).join('');
  document.getElementById('qrModal').classList.add('open');
}
function closeQr() { document.getElementById('qrModal').classList.remove('open'); }

function printVouchers() {
  const area = document.getElementById('printArea');
  area.innerHTML = `<div class="qr-grid">${document.getElementById('qr_grid').innerHTML}</div>`;
  area.style.display = 'block';
  window.print();
  setTimeout(() => { area.style.display = 'none'; area.innerHTML = ''; }, 500);
}

function printAllVouchers() {
  const open = _lastPasses.filter(p => p.status !== 'cancelled');
  if (!open.length) { alert(s.noPassesToPrint); return; }
  showQr(open.map(p => p.code), fmt(s.vouchersCountTitle, { n: open.length }));
}

// ── CSV export ─────────────────────────────────────────────────
function exportCsv() {
  if (!_lastPasses.length) { alert(s.nothingToExport); return; }
  const head = s.csvHeaders;
  const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = _lastPasses.map(p => [
    p.code, p.traveler_name || '', p.start_date, p.days, p.status,
    ((p.net_cents || 0) / 100).toFixed(2), REDEEM_BASE + p.code,
  ].map(esc).join(','));
  // BOM so Excel opens accented names correctly.
  const blob = new Blob(['\ufeff' + [head.map(esc).join(','), ...rows].join('\r\n')],
                        { type: 'text/csv;charset=utf-8;' });
  const month = document.getElementById('filterMonth').value || 'all';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `trip-passes-${month}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ── Edit modal ─────────────────────────────────────────────────
let _editing = null;

function openEdit(code) {
  const p = _lastPasses.find(x => x.code === code);
  if (!p) return;
  _editing = code;
  document.getElementById('ed_code').textContent = code;
  document.getElementById('ed_traveler').value = p.traveler_name || '';
  document.getElementById('ed_start').value = p.start_date;
  document.getElementById('ed_days').value = p.days;
  document.getElementById('ed_msg').textContent = '';
  document.getElementById('editModal').classList.add('open');
}
function closeEdit() { document.getElementById('editModal').classList.remove('open'); _editing = null; }

async function saveEdit() {
  if (!_editing) return;
  const btn = document.getElementById('ed_save');
  const msg = document.getElementById('ed_msg');
  const start = document.getElementById('ed_start').value;
  const days = parseInt(document.getElementById('ed_days').value, 10);
  const traveler = document.getElementById('ed_traveler').value.trim();
  if (!start || !days) { msg.className = 'msg err'; msg.textContent = s.fillDateAndDays; return; }
  btn.disabled = true; msg.className = 'msg'; msg.textContent = s.saving;
  try {
    await api(`/agency/trip-passes/${encodeURIComponent(_editing)}`, {
      method: 'PATCH',
      body: JSON.stringify({ start_date: start, days, traveler_name: traveler }),
    });
    closeEdit();
    loadPasses();
  } catch (e) {
    msg.className = 'msg err'; msg.textContent = e.message;
  } finally { btn.disabled = false; }
}

// ── boot ──
(function () {
  document.documentElement.lang = LANG;
  applyStaticStrings();
  const resetToken = new URLSearchParams(location.search).get('reset_token');
  if (resetToken) { show('resetForm'); setTitle('resetForm'); return; }
  if (tok()) enterPortal();
})();
</script>
