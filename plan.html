  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #FAF7F3; --surface: #FFFFFF; --ink: #221F1C; --muted: #5A524A; --faint: #6B6259; --line: #EDE7DE; --field: #DDD5CB;

    a { color: var(--accent-ink); }
    [hidden] { display: none !important; }
    .wrap { max-width: 560px; margin: 0 auto; padding-bottom: 40px; }
    header.bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); }
    header.bar .brand { font-weight: 800; font-size: 17px; color: var(--ink); text-decoration: none; }
    header.bar .get { font-weight: 700; font-size: 14px; text-decoration: none; }
    main { padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; }
    .kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); }
    h1 { margin: 6px 0 8px; font-size: 30px; line-height: 1.12; font-weight: 800; text-wrap: balance; }
    .lead { margin: 0; font-size: 15px; color: var(--muted); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    label, .label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
    input, select { font: inherit; font-size: 16px; padding: 12px; border: 1px solid var(--field); border-radius: 10px; color: var(--ink); background: var(--surface); width: 100%; min-width: 0; }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
    .two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 10px; }
    .city { position: relative; }
    .sugg { position: absolute; z-index: 5; left: 0; right: 0; top: 100%; margin-top: 4px; background: var(--surface); border: 1px solid var(--field); border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.08); overflow: hidden; }
    .sugg button { display: block; width: 100%; text-align: left; padding: 11px 12px; border: 0; background: none; font: inherit; font-size: 15px; color: var(--ink); cursor: pointer; }
    .sugg button span { color: var(--faint); font-size: 13px; }
    .sugg button:hover, .sugg button:focus { background: var(--chip); outline: none; }
    .seg { display: flex; gap: 8px; }
    .seg button, .chips button { font: inherit; cursor: pointer; border: 1px solid var(--field); background: var(--surface); color: var(--ink); }
    .seg button { flex: 1; padding: 11px 0; border-radius: 999px; font-size: 14px; font-weight: 600; }
    .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips button { padding: 8px 13px; border-radius: 999px; font-size: 14px; }
    .chips button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
    .go { padding: 15px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; }
    .go:disabled { opacity: .55; cursor: default; }
    .go:focus-visible, .seg button:focus-visible, .chips button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .small { font-size: 12px; color: var(--faint); text-align: center; }
    .err { background: var(--danger-soft); color: var(--danger-ink); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
    .loading { text-align: center; padding: 50px 10px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
    .spinner { width: 42px; height: 42px; border-radius: 50%; border: 4px solid var(--accent-soft); border-top-color: var(--accent); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    .loading b { font-size: 18px; }
    .loading span { color: var(--muted); font-size: 15px; min-height: 1.5em; }
    .plancard { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-decoration: none; color: var(--ink); }
    .plancard b { display: block; font-size: 15px; }
    .plancard small { font-size: 13px; color: var(--faint); }
    .plancard em { font-style: normal; font-weight: 700; color: var(--accent-ink); font-size: 14px; }
    .btn { display: block; text-align: center; padding: 15px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 800; text-decoration: none; }
    .why { display: grid; gap: 12px; }
    .why div { display: flex; gap: 10px; font-size: 14px; color: var(--muted); line-height: 1.45; }
    .why svg { flex: none; width: 20px; height: 20px; margin-top: 1px; }
    footer { text-align: center; font-size: 12px; color: var(--faint); padding: 10px 20px 0; }

    || Object.keys(STR).find(k => k.slice(0, 2) === n.slice(0, 2).toLowerCase()) || 'en';
}

    let v = localStorage.getItem('ut_web_visitor');
    if (!v || !/^[A-Za-z0-9_-]{16,64}$/.test(v)) {
      v = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)).replace(/[^A-Za-z0-9]/g, '');
      localStorage.setItem('ut_web_visitor', v);
    }
    return v;
  } catch (e) { return 'nostorage' + Math.random().toString(36).slice(2, 14); }
}
const VISITOR = visitorId();
function track(event, props) {
  try {
    fetch(`${API}/public/web-plan/event`, { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ visitor_id: VISITOR, event, props: { lang: LANG, ...(props || {}) } }) }).catch(() => {});
  } catch (e) {}
}
const planUrl = (bundle) => `tour.html?bundle=${encodeURIComponent(bundle)}&from=webplan&lang=${encodeURIComponent(LANG)}`;
function storeLink(el, where) {
  el.href = store;
  el.addEventListener('click', () => track('store_click', { where, store: store === IOS ? 'ios' : 'android' }));
}
storeLink(getApp, 'header');

function show(id) { ['formView', 'loadingView', 'usedView', 'offView'].forEach(v => { document.getElementById(v).hidden = v !== id; }); }

// ── City field: suggestions from the same city search as the app ──
const cityInput = document.getElementById('city'), sugg = document.getElementById('sugg');
let chosen = null, timer = null, started = false;
cityInput.addEventListener('input', () => {
  chosen = null;
  if (!started) { started = true; track('form_start'); }
  clearTimeout(timer);
  const v = cityInput.value.trim();
  if (v.length < 3) { sugg.hidden = true; return; }
  timer = setTimeout(async () => {
    try {
      const r = await fetch(`${API}/public/web-plan/cities?q=${encodeURIComponent(v)}`);
      const { cities } = await r.json();
      if (!cities || !cities.length || cityInput.value.trim() !== v) { sugg.hidden = true; return; }
      sugg.innerHTML = '';
      cities.forEach(c => {
        const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'option');
        b.textContent = c.name + ' ';
        const s = document.createElement('span'); s.textContent = c.country; b.appendChild(s);
        b.addEventListener('click', () => { chosen = c; cityInput.value = c.name; sugg.hidden = true; cityInput.focus(); });
        sugg.appendChild(b);
      });
      sugg.hidden = false;
    } catch (e) { sugg.hidden = true; }
  }, 350);
});
document.addEventListener('click', (e) => { if (!e.target.closest('.city')) sugg.hidden = true; });

// ── Pace and interests ──
document.querySelectorAll('#pace button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#pace button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
}));
document.querySelectorAll('#interests button').forEach(b => b.addEventListener('click', () => {
  b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
}));
const dateInput = document.getElementById('date');
const today = new Date(); const iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
dateInput.min = iso(today); dateInput.value = iso(new Date(today.getTime() + 7 * 86400000));

const errEl = document.getElementById('err');
function fail(msg) { show('formView'); errEl.textContent = msg; errEl.hidden = false; document.getElementById('go').disabled = false; }

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.hidden = true;
  const city = cityInput.value.trim();
  if (city.length < 2) { errEl.textContent = S.needCity; errEl.hidden = false; cityInput.focus(); return; }
  document.getElementById('go').disabled = true;
  show('loadingView');
  const step = document.getElementById('step'); let i = 0; step.textContent = S.steps[0];
  const tick = setInterval(() => { i = Math.min(i + 1, S.steps.length - 1); step.textContent = S.steps[i]; }, 6000);
  try {
    const r = await fetch(`${API}/public/web-plan`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
      visitor_id: VISITOR, city: chosen ? chosen.name : city, country: chosen ? chosen.country : '',
      date: dateInput.value || null, days: Number(document.getElementById('days').value),
      pace: document.querySelector('#pace [aria-pressed="true"]').dataset.v,
      interests: [...document.querySelectorAll('#interests [aria-pressed="true"]')].map(b => b.dataset.v), lang: LANG }) });
    const body = await r.json().catch(() => ({}));
    clearInterval(tick);
    if (r.ok && body.bundle) { location.href = planUrl(body.bundle); return; }
    if (r.status === 429 && body.detail === 'visitor') return init();
    if (r.status === 429) return fail(body.detail === 'daily_cap' ? S.errCap : S.errBusy);
    if (r.status === 503) return show('offView');
    fail(r.status === 400 || r.status === 422 ? (body.detail || S.errGeneric) : S.errGeneric);
  } catch (err) { clearInterval(tick); fail(S.errGeneric); }
});

async function init() {
  storeLink(document.getElementById('usedApp'), 'used');
  storeLink(document.getElementById('offApp'), 'off');
  try {
    const r = await fetch(`${API}/public/web-plan/status?visitor=${encodeURIComponent(VISITOR)}`);
    const st = await r.json();
    if (st.plan) {
      const p = st.plan;
      document.getElementById('usedName').textContent = p.days > 1 ? f(S.inDays, { city: p.city, n: p.days }) : f(S.inDay, { city: p.city });
      document.getElementById('usedDate').textContent = p.date ? new Date(p.date + 'T12:00:00').toLocaleDateString(LANG, { weekday: 'short', day: 'numeric', month: 'short' }) : '';
      document.getElementById('usedPlan').href = planUrl(p.bundle);
      show('usedView'); track('used_view'); return;
    }
    if (!st.enabled) { show('offView'); track('page_view', { plan: 'off' }); return; }
  } catch (e) { /* show the form; the plan request reports its own errors */ }
  show('formView');
  track('page_view', { ref: (document.referrer || '').replace(/^https?:\/\//, '').split('/')[0].slice(0, 60) });
}
init();
</script>
