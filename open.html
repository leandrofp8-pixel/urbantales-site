<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Open Urban Tales</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- 2026-11-11 (Leandro: "send current users to the app, not the web planner"): links in emails land here.
       Opens the app when installed (urbantales:// link, same approach as tour.html), else the store. -->
  <style>
    :root { --bg: #FAF7F3; --ink: #221F1C; --muted: #5A524A; --accent: #E8661C; --line: #EDE7DE; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 440px; margin: 0 auto; padding: 64px 20px; text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; }
    .logo { font-weight: 800; font-size: 20px; } .logo span { color: var(--accent); }
    h1 { margin: 8px 0 0; font-size: 24px; line-height: 1.2; }
    p { margin: 0; color: var(--muted); }
    a.btn { display: inline-block; padding: 14px 22px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 800; text-decoration: none; }
    .stores { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: 14px; }
    .stores a { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <div class="logo">Urban <span>Tales</span></div>
  <h1 id="t">Opening Urban Tales…</h1>
  <p id="s">If nothing happens, tap the button.</p>
  <a class="btn" id="open" href="urbantales://open">Open the app</a>
  <div class="stores"><a id="ios" href="https://apps.apple.com/app/id6760130598">App Store</a> · <a id="android" href="https://play.google.com/store/apps/details?id=com.urbantales.app">Google Play</a></div>
</main>
<script>
const IOS = 'https://apps.apple.com/app/id6760130598';
const ANDROID = 'https://play.google.com/store/apps/details?id=com.urbantales.app';
const ua = navigator.userAgent;
const store = /iPhone|iPad|iPod/i.test(ua) ? IOS : (/Android/i.test(ua) ? ANDROID : null);
const STR = {
  es: ['Abriendo Urban Tales…', 'Si no pasa nada, toca el botón.', 'Abrir la app'],
  pt: ['Abrindo o Urban Tales…', 'Se nada acontecer, toque no botão.', 'Abrir o app'],
  fr: ['Ouverture d’Urban Tales…', 'Si rien ne se passe, touchez le bouton.', 'Ouvrir l’app'],
  de: ['Urban Tales wird geöffnet…', 'Wenn nichts passiert, tippe auf den Button.', 'App öffnen'],
};
const l = STR[(navigator.language || 'en').slice(0, 2)];
if (l) { document.getElementById('t').textContent = l[0]; document.getElementById('s').textContent = l[1]; document.getElementById('open').textContent = l[2]; }
// Open the app if installed; if the page is still visible after a moment, it isn't: go to the store.
function tryOpen() {
  if (!store) return;  // computer: show the buttons only
  const t = setTimeout(() => { location.href = store; }, 1500);
  window.addEventListener('pagehide', () => clearTimeout(t), { once: true });
  document.addEventListener('visibilitychange', () => { if (document.hidden) clearTimeout(t); }, { once: true });
  location.href = 'urbantales://open';
}
document.getElementById('open').addEventListener('click', (e) => { e.preventDefault(); tryOpen(); });
tryOpen();
</script>

</body>
</html>
