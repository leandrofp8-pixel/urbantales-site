<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Get Urban Tales — Audio Guide</title>
  <meta name="description" content="Get Urban Tales for iPhone or Android. Turn any walk into a city tour.">
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; color: #25302c; background: #f7f5ef; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
    main { max-width: 30rem; padding: 3rem 1.5rem; text-align: center; }
    .brand { font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #596951; }
    h1 { font-size: clamp(2rem, 8vw, 3rem); line-height: 1.12; }
    p { line-height: 1.6; }
    .stores { display: grid; gap: .8rem; margin: 2rem 0; }
    .stores a { padding: 1rem; border-radius: .8rem; background: #253e35; color: white; text-decoration: none; font-weight: 600; }
    a { color: #253e35; } a:focus-visible { outline: 3px solid #b07832; outline-offset: 4px; }
    .hint { font-size: .9rem; color: #5d655e; }
  </style>
  <script src="redirect.js" defer></script>
</head>
<body>
  <main>
    <p class="brand">Urban Tales</p>
    <h1>Turn any walk into a city tour.</h1>
    <p id="status" role="status">Get your audio guide for iPhone or Android.</p>
    <div class="stores">
      <a id="apple" href="https://apps.apple.com/app/id6760130598?pt=128624357&amp;ct=download-direct&amp;mt=8">Download on the App Store</a>
      <a id="google" href="https://play.google.com/store/apps/details?id=com.urbantales.app">Get it on Google Play</a>
    </div>
    <p class="hint">If the store doesn’t open, tap its button above or open this page in your phone’s browser.</p>
    <p><a href="/">Discover Urban Tales</a></p>
  </main>
</body>
</html>
