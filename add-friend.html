<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Friend on Urban Tales</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta property="og:title" content="Join me on Urban Tales!">
  <meta property="og:description" content="Explore cities and discover landmark stories together.">
  <meta property="og:image" content="https://urbantales.net/banner.png">
  <style>
    body { background: #0f0f1a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; }
    .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.04));
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,.4);
    }
    .avatar { font-size: 64px; margin-bottom: 16px; }
    .title { font-size: 24px; font-weight: 700; margin: 0 0 8px; }
    .subtitle { font-size: 15px; color: #aaa; margin: 0 0 32px; line-height: 1.5; }
    .open-btn {
      display: block; width: 100%; padding: 16px;
      background: #FF6B35; color: #fff; font-size: 17px; font-weight: 700;
      border: none; border-radius: 14px; cursor: pointer; text-decoration: none;
      margin-bottom: 12px; box-sizing: border-box;
    }
    .open-btn:hover { background: #e55a25; }
    .store-row { display: flex; gap: 10px; margin-top: 4px; }
    .store-btn {
      flex: 1; padding: 12px 8px;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px; color: #ccc; font-size: 13px; font-weight: 600;
      text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .store-btn:hover { background: rgba(255,255,255,.10); }
    .divider { font-size: 12px; color: #555; margin: 16px 0 12px; }
    .logo { width: 48px; height: 48px; border-radius: 12px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <img src="icon.png" class="logo" alt="Urban Tales" />
      <div class="avatar">👋</div>
      <h1 class="title" id="invite-title">Someone wants to be your friend!</h1>
      <p class="subtitle" id="invite-sub">Open Urban Tales to accept the friend request and compare your city explorations on the leaderboard.</p>

      <a class="open-btn" id="open-app-btn" href="#">Open in Urban Tales</a>

      <div class="divider">Don't have the app yet?</div>
      <div class="store-row">
        <a class="store-btn" href="https://apps.apple.com/us/app/urban-tales-city-explorer/id6760130598" target="_blank">
          🍎 App Store
        </a>
        <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.urbantales.app" target="_blank">
          ▶ Google Play
        </a>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const userId = params.get('userId');
    const name   = params.get('name');

    if (name) {
      document.getElementById('invite-title').textContent = name + ' wants to be your friend!';
      document.getElementById('invite-sub').textContent =
        'Open Urban Tales to accept ' + name + '\'s friend request and compete on the leaderboard.';
    }

    const deepLink = userId ? 'urbantales://add-friend?userId=' + encodeURIComponent(userId) : 'urbantales://';
    const btn = document.getElementById('open-app-btn');
    btn.href = deepLink;

    btn.addEventListener('click', function(e) {
      e.preventDefault();
      window.location.href = deepLink;
      // After 2s, if still here, user doesn't have app — show store links
      setTimeout(function() {
        document.querySelector('.divider').style.display = 'block';
        document.querySelector('.store-row').style.display = 'flex';
      }, 2000);
    });

    // Auto-attempt open on page load (mobile only)
    if (/iPhone|iPad|Android/i.test(navigator.userAgent) && userId) {
      setTimeout(function() { window.location.href = deepLink; }, 300);
    }
  </script>
</body>
</html>
