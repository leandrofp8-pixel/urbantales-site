<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Urban Tales: a shared trip</title>
  <meta name="description" content="A trip shared on Urban Tales: the stops day by day, with the story of every place told as you walk.">

  <!-- Open Graph (filled dynamically) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Urban Tales">
  <meta property="og:title" content="A trip shared on Urban Tales">
  <meta property="og:description" content="The stops day by day, with the story of every place told as you walk.">
  <meta property="og:url" content="https://urbantales.net/tour.html">
  <meta property="og:image" content="https://urbantales.net/banner.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://urbantales.net/banner.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
  <link rel="apple-touch-icon" href="icon.png">

  <!-- 2026-11-03 share redesign (mockup "Share Tour Redesign", approved by Leandro): the app's light
       look, day tabs, a route drawing per day, each stop's visit time and tip, an audio preview of
       the first stop and one fixed button that opens the trip in the app. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #FAF7F3; --surface: #FFFFFF; --ink: #221F1C; --muted: #5A524A; --faint: #6B6259; --line: #EDE7DE;
      --accent: #E8661C; --accent-ink: #B4470F; --accent-soft: #FBE6D8; --dark: #221F1C; --ok-soft: #E1F1E6; --ok-ink: #1E5233;
    }
    html, body { margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    a { color: var(--accent-ink); }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 0 140px; }
    header.bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); }
    header.bar .brand { font-weight: 800; font-size: 17px; color: var(--ink); text-decoration: none; }
    header.bar .get { font-weight: 700; font-size: 14px; text-decoration: none; }
    main { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
    .kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); }
    h1 { margin: 6px 0 4px; font-size: 28px; line-height: 1.12; font-weight: 800; }
    .meta { font-size: 14px; color: var(--muted); }
    .listen { display: flex; gap: 12px; align-items: center; background: var(--dark); color: #fff; border-radius: 16px; padding: 12px; }
    .listen button { flex: none; width: 48px; height: 48px; border-radius: 24px; border: 0; background: var(--accent); color: #fff; cursor: pointer; display: grid; place-items: center; }
    .listen button svg { width: 22px; height: 22px; fill: #fff; }
    .listen .t { font-size: 14px; font-weight: 800; }
    .listen .s { font-size: 12px; color: #D9D3CB; }
    .bar-progress { height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); margin-top: 6px; overflow: hidden; }
    .bar-progress i { display: block; height: 100%; width: 0; background: var(--accent); }
    .tabs { display: flex; gap: 4px; background: var(--line); border-radius: 12px; padding: 4px; overflow-x: auto; }
    .tabs button { flex: 1 0 auto; padding: 10px 12px; border: 0; border-radius: 9px; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 700; }
    .route { height: 230px; border-radius: 14px; overflow: hidden; background: #E8E4DD; z-index: 0; margin-bottom: 16px; }
    .pin { width: 26px; height: 26px; border-radius: 13px; background: #E8661C; color: #fff; border: 2px solid #fff; display: grid; place-items: center; font: 800 12px/1 -apple-system, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
    .stops { display: flex; flex-direction: column; gap: 14px; margin: 0; padding: 0; list-style: none; }
    .stop { display: flex; gap: 12px; align-items: flex-start; }
    .num { flex: none; width: 28px; height: 28px; border-radius: 14px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 800; }
    .stop .row { display: flex; justify-content: space-between; gap: 8px; }
    .stop .name { font-size: 15px; font-weight: 700; }
    .stop .dur { flex: none; font-size: 12px; color: var(--faint); }
    .stop .tip { font-size: 13px; line-height: 1.45; color: var(--muted); margin-top: 2px; }
    .note { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); border-radius: 12px; padding: 12px; font-size: 13px; line-height: 1.45; color: #6A2E0A; }
    .note svg { flex: none; width: 18px; height: 18px; margin-top: 1px; }
    .inapp { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
    .inapp b { font-size: 16px; }
    .inapp span { font-size: 14px; color: var(--muted); line-height: 1.45; }
    .badges { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: center; }
    .badges img { height: 48px; width: auto; display: block; }
    .cta { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 20px calc(16px + env(safe-area-inset-bottom)); }
    .cta .in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
    .cta a.btn { display: block; text-align: center; padding: 15px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 800; text-decoration: none; }
    .cta small { display: block; text-align: center; font-size: 12px; color: var(--faint); }
    .state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .state b { display: block; font-size: 20px; color: var(--ink); margin-bottom: 6px; }
    footer { text-align: center; font-size: 12px; color: var(--faint); padding: 10px 20px 0; }
  </style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="brand" href="https://urbantales.net">Urban Tales</a>
    <a class="get" id="getApp" href="https://apps.apple.com/app/id6760130598">Get the app</a>
  </header>
  <main id="root"><div class="state">…</div></main>
  <footer>© 2026 Urban Tales · <a href="https://urbantales.net">urbantales.net</a> · <a href="https://urbantales.net/privacy">Privacy</a></footer>
</div>
<div class="cta" id="cta" hidden>
  <div class="in">
    <a class="btn" id="openBtn" href="#">Follow this trip in the app</a>
    <small id="ctaSub"></small>
  </div>
</div>

<script>
const API_BASE = 'https://friendly-fulfillment-production.up.railway.app';
const IOS = 'https://apps.apple.com/app/id6760130598';
const ANDROID = 'https://play.google.com/store/apps/details?id=com.urbantales.app';
const q = new URLSearchParams(location.search);

const STR = {
  en: { sharedBy: 'A trip shared by {name}', shared: 'A shared trip', inDays: '{city} in {n} days', stops: '{n} stops', day: 'Day {n}',
        min: '{n} min', hear: 'Hear the first stop: {name}', hearSub: 'A short preview · every stop has its story in the app',
        dates: 'Going on other dates? The app checks opening days and moves places that are closed on yours.',
        inappT: 'On the day, the app does the rest', inappS: 'The story of every stop as you arrive, the plan offline with no data, and Pocket Mode: phone in your pocket, each stop plays by itself.',
        follow: 'Follow this trip in the app', followSub: 'Free to start · iPhone and Android', notFound: 'This trip is no longer shared', notFoundS: 'It may have been removed or made private.',
        error: 'Something went wrong', errorS: 'Please try again in a moment.', route: 'Route of the day', getApp: 'Get the app' },
  es: { sharedBy: 'Un viaje compartido por {name}', shared: 'Un viaje compartido', inDays: '{city} en {n} días', stops: '{n} paradas', day: 'Día {n}',
        min: '{n} min', hear: 'Escucha la primera parada: {name}', hearSub: 'Una muestra · cada parada tiene su historia en la app',
        dates: '¿Vas en otras fechas? La app revisa los horarios y mueve los lugares que cierran en tus días.',
        inappT: 'El día del paseo, la app hace el resto', inappS: 'La historia de cada parada al llegar, el plan sin internet y el Modo Bolsillo: con el celular en el bolsillo, cada parada suena sola.',
        follow: 'Seguir este viaje en la app', followSub: 'Gratis para empezar · iPhone y Android', notFound: 'Este viaje ya no está compartido', notFoundS: 'Puede que lo hayan borrado o hecho privado.',
        error: 'Algo salió mal', errorS: 'Inténtalo de nuevo en un momento.', route: 'Recorrido del día', getApp: 'Descargar la app' },
  'pt-BR': { sharedBy: 'Uma viagem compartilhada por {name}', shared: 'Uma viagem compartilhada', inDays: '{city} em {n} dias', stops: '{n} paradas', day: 'Dia {n}',
        min: '{n} min', hear: 'Ouça a primeira parada: {name}', hearSub: 'Uma amostra · cada parada tem sua história no app',
        dates: 'Vai em outras datas? O app confere os horários e muda os lugares que fecham nos seus dias.',
        inappT: 'No dia, o app faz o resto', inappS: 'A história de cada parada quando você chega, o plano sem internet e o Modo Bolso: celular no bolso, cada parada toca sozinha.',
        follow: 'Seguir esta viagem no app', followSub: 'Grátis para começar · iPhone e Android', notFound: 'Esta viagem não está mais compartilhada', notFoundS: 'Ela pode ter sido apagada ou ficado privada.',
        error: 'Algo deu errado', errorS: 'Tente de novo em instantes.', route: 'Trajeto do dia', getApp: 'Baixar o app' },
  fr: { sharedBy: 'Un voyage partagé par {name}', shared: 'Un voyage partagé', inDays: '{city} en {n} jours', stops: '{n} étapes', day: 'Jour {n}',
        min: '{n} min', hear: 'Écoutez la première étape : {name}', hearSub: 'Un aperçu · chaque étape a son histoire dans l\'app',
        dates: 'D\'autres dates ? L\'app vérifie les horaires et déplace les lieux fermés ces jours-là.',
        inappT: 'Le jour venu, l\'app fait le reste', inappS: 'L\'histoire de chaque étape à votre arrivée, le plan hors ligne et le Mode Poche : téléphone en poche, chaque étape se lance seule.',
        follow: 'Suivre ce voyage dans l\'app', followSub: 'Gratuit pour commencer · iPhone et Android', notFound: 'Ce voyage n\'est plus partagé', notFoundS: 'Il a peut-être été supprimé ou rendu privé.',
        error: 'Un problème est survenu', errorS: 'Réessayez dans un instant.', route: 'Itinéraire du jour', getApp: 'Télécharger l\'app' },
  de: { sharedBy: 'Eine Reise, geteilt von {name}', shared: 'Eine geteilte Reise', inDays: '{city} in {n} Tagen', stops: '{n} Stopps', day: 'Tag {n}',
        min: '{n} Min.', hear: 'Hör den ersten Stopp: {name}', hearSub: 'Eine Hörprobe · jeder Stopp hat seine Geschichte in der App',
        dates: 'Andere Daten? Die App prüft die Öffnungszeiten und verschiebt Orte, die an deinen Tagen geschlossen sind.',
        inappT: 'Am Tag selbst macht die App den Rest', inappS: 'Die Geschichte jedes Stopps bei der Ankunft, der Plan offline und der Taschenmodus: Handy in der Tasche, jeder Stopp startet von selbst.',
        follow: 'Dieser Reise in der App folgen', followSub: 'Kostenlos starten · iPhone und Android', notFound: 'Diese Reise wird nicht mehr geteilt', notFoundS: 'Sie wurde vielleicht gelöscht oder privat gemacht.',
        error: 'Etwas ist schiefgelaufen', errorS: 'Bitte versuch es gleich noch einmal.', route: 'Route des Tages', getApp: 'App laden' },
};
function lang() {
  const p = q.get('lang'); if (STR[p]) return p;
  const n = (navigator.language || 'en');
  return Object.keys(STR).find(k => k.toLowerCase() === n.toLowerCase())
    || Object.keys(STR).find(k => k.slice(0, 2) === n.slice(0, 2).toLowerCase()) || 'en';
}
const LANG = lang(); const S = STR[LANG];
const f = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
const store = isIOS ? IOS : (/Android/i.test(navigator.userAgent) ? ANDROID : IOS);
document.documentElement.lang = LANG;
document.getElementById('getApp').textContent = S.getApp;
document.getElementById('getApp').href = store;

async function load(path) {
  const r = await fetch(`${API_BASE}${path}?lang=${encodeURIComponent(LANG)}`);
  if (!r.ok) throw new Error(r.status === 404 ? 'not_found' : 'error');
  return r.json();
}

// A real map of the day (OpenStreetMap via Leaflet): numbered stops in walking order.
let map = null;
function showMap(stops) {
  const el = document.getElementById('map');
  const pts = stops.map((s, i) => ({ ...s, n: i + 1 })).filter(s => typeof s.latitude === 'number' && typeof s.longitude === 'number');
  if (!el) return;
  if (pts.length < 1 || !window.L) { el.hidden = true; return; }
  el.hidden = false;
  if (map) { map.remove(); map = null; }
  map = L.map(el, { scrollWheelZoom: false, attributionControl: true, zoomControl: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
  const ll = pts.map(p => [p.latitude, p.longitude]);
  if (ll.length > 1) L.polyline(ll, { color: '#B4470F', weight: 3, dashArray: '6 6' }).addTo(map);
  pts.forEach(p => L.marker([p.latitude, p.longitude], { title: p.name,
    icon: L.divIcon({ className: '', html: `<div class="pin">${p.n}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] }) }).addTo(map));
  if (ll.length > 1) map.fitBounds(ll, { padding: [26, 26] }); else map.setView(ll[0], 16);
}

function stopsHtml(stops) {
  return `<ol class="stops">${stops.map((s, i) => `
    <li class="stop"><span class="num">${i + 1}</span><div style="flex:1">
      <div class="row"><span class="name">${esc(s.name)}</span>${s.visit_minutes ? `<span class="dur">${esc(f(S.min, { n: s.visit_minutes }))}</span>` : ''}</div>
      ${s.tip || s.reason ? `<div class="tip">${esc(s.tip || s.reason)}</div>` : ''}
    </div></li>`).join('')}</ol>`;
}

function setupAudio(b64) {
  const btn = document.getElementById('playBtn'); if (!btn || !b64) return;
  const audio = new Audio(`data:audio/mpeg;base64,${b64}`);
  const bar = document.getElementById('progress');
  const play = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>', pause = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
  audio.addEventListener('timeupdate', () => { if (audio.duration) bar.style.width = `${audio.currentTime / audio.duration * 100}%`; });
  audio.addEventListener('ended', () => { btn.innerHTML = play; bar.style.width = '0'; });
  btn.addEventListener('click', () => { if (audio.paused) { audio.play(); btn.innerHTML = pause; } else { audio.pause(); btn.innerHTML = play; } });
}

function render({ days, city, title, creator, deepLink, audio }) {
  const total = days.reduce((n, d) => n + d.stops.length, 0);
  const heading = days.length > 1 ? f(S.inDays, { city, n: days.length }) : (title || city);
  document.title = `${heading} · Urban Tales`;
  const set = (p, v) => document.querySelector(`[property="${p}"]`)?.setAttribute('content', v);
  set('og:title', `${heading} · Urban Tales`); set('og:url', location.href);
  const first = days[0].stops[0];
  document.getElementById('root').innerHTML = `
    <div>
      <div class="kicker">${esc(creator ? f(S.sharedBy, { name: creator }) : S.shared)}</div>
      <h1>${esc(heading)}</h1>
      <div class="meta">${esc(city)} · ${esc(f(S.stops, { n: total }))}</div>
    </div>
    ${audio && first ? `<div class="listen"><button id="playBtn" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <div style="flex:1"><div class="t">${esc(f(S.hear, { name: first.name }))}</div><div class="s">${esc(S.hearSub)}</div><div class="bar-progress"><i id="progress"></i></div></div></div>` : ''}
    ${days.length > 1 ? `<div class="tabs" role="tablist">${days.map((d, i) => `<button role="tab" aria-selected="${i === 0}" data-day="${i}">${esc(f(S.day, { n: i + 1 }))}</button>`).join('')}</div>` : ''}
    <div id="day"></div>
    <div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="#B4470F" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>${esc(S.dates)}</span></div>
    <div class="inapp"><b>${esc(S.inappT)}</b><span>${esc(S.inappS)}</span></div>
    <div class="badges"><a href="${IOS}"><img src="badges/apple.svg" alt="Download on the App Store" height="48"></a><a href="${ANDROID}"><img src="badges/google-${LANG}.png" alt="Get it on Google Play" height="48"></a></div>`;
  const showDay = (i) => {
    document.getElementById('day').innerHTML = `<div class="route" id="map" role="img" aria-label="${esc(S.route)}"></div>` + stopsHtml(days[i].stops);
    const draw = () => showMap(days[i].stops);
    if (window.L) draw(); else window.addEventListener('load', draw, { once: true });
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(Number(b.dataset.day) === i)));
  };
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => showDay(Number(b.dataset.day))));
  showDay(0);
  setupAudio(audio);
  // Open in the app when installed, else the store (the app stores the id and offers the trip after sign-in).
  const open = document.getElementById('openBtn');
  open.textContent = S.follow; document.getElementById('ctaSub').textContent = S.followSub;
  open.addEventListener('click', (e) => {
    e.preventDefault();
    const t = setTimeout(() => { location.href = store; }, 1400);
    window.addEventListener('pagehide', () => clearTimeout(t), { once: true });
    location.href = deepLink;
  });
  document.getElementById('cta').hidden = false;
}

function renderError(type) {
  const nf = type === 'not_found';
  document.getElementById('root').innerHTML = `<div class="state"><b>${esc(nf ? S.notFound : S.error)}</b>${esc(nf ? S.notFoundS : S.errorS)}<br><br><a href="https://urbantales.net">urbantales.net</a></div>`;
}

const firstName = (d) => d.creator_first_name
  || ((n) => (n && !/^explor/i.test(n.trim()) ? n.trim().split(/\s+/)[0] : null))(d.creator_display_name);

(async () => {
  const bundleId = q.get('bundle'), id = q.get('id');
  if (!bundleId && !id) return renderError('not_found');
  try {
    if (bundleId) {
      const b = await load(`/api/tours/bundle/${encodeURIComponent(bundleId)}/public`);
      const ds = b.days || []; if (!ds.length) return renderError('not_found');
      render({ days: ds.map(d => ({ stops: d.landmarks_preview || [] })), city: ds[0].city || '', title: ds[0].name,
               creator: firstName(ds[0]), deepLink: `urbantales://bundle?id=${bundleId}`, audio: ds[0].preview_audio_b64 });
    } else {
      const t = await load(`/api/tours/${encodeURIComponent(id)}/public`);
      render({ days: [{ stops: t.landmarks_preview || [] }], city: t.city || '', title: t.name, creator: firstName(t),
               deepLink: `urbantales://tour?id=${id}`, audio: t.preview_audio_b64 });
    }
  } catch (e) {
    renderError(e.message === 'not_found' ? 'not_found' : 'error');
  }
})();
</script>
