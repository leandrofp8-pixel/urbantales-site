<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Tales — Tour Preview</title>
  <meta name="description" content="Explore this guided tour on Urban Tales — AI-powered audio stories for every landmark.">

  <!-- Open Graph (filled dynamically) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Urban Tales">
  <meta property="og:image" content="https://urbantales.net/banner.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://urbantales.net/banner.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0D1B2A;
      --card:    #12263A;
      --gold:    #C9A84C;
      --orange:  #FF6B35;
      --text:    #F0F0F0;
      --muted:   #7A9BBF;
      --border:  #1E3A5A;
      --green:   #2E7D32;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0;
    }

    /* ── TOP NAV ── */
    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar-logo { font-size: 22px; }
    .topbar-brand { font-size: 17px; font-weight: 800; color: var(--gold); letter-spacing: 2px; }
    .topbar-sub   { font-size: 10px; color: var(--muted); letter-spacing: 2px; }

    /* ── HERO STRIP ── */
    .hero-strip {
      background: linear-gradient(135deg, #0a1828 0%, #142d47 100%);
      border-bottom: 2px solid var(--gold);
      padding: 32px 20px 24px;
      text-align: center;
    }
    .hero-city {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .hero-title {
      font-size: 26px;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 10px;
      line-height: 1.25;
    }
    .hero-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .hero-badge {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 12px;
      color: var(--muted);
    }
    .hero-badge span { color: var(--text); font-weight: 700; }
    .creator-tag {
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
    }
    .creator-tag b { color: var(--gold); font-style: normal; }

    /* ── MAIN CONTENT ── */
    .page { max-width: 600px; margin: 0 auto; padding: 24px 16px 80px; }

    /* ── AUDIO PREVIEW ── */
    .preview-card {
      background: var(--card);
      border: 1px solid var(--gold);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .preview-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .audio-player-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .play-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--orange);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }
    .play-btn:hover  { background: #ff8555; }
    .play-btn:active { transform: scale(0.95); }
    .play-btn svg { width: 22px; height: 22px; fill: #fff; }
    .play-btn.loading { background: #555; cursor: not-allowed; }
    .play-btn.playing { background: #c0552a; }

    .audio-info { flex: 1; min-width: 0; }
    .audio-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .audio-progress {
      height: 4px;
      background: #1e3a5a;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .audio-progress-fill {
      height: 100%;
      background: var(--orange);
      border-radius: 2px;
      width: 0%;
      transition: width 0.2s linear;
    }
    .audio-time {
      font-size: 10px;
      color: var(--muted);
    }
    .preview-notice {
      margin-top: 12px;
      padding: 10px 14px;
      background: rgba(201,168,76,0.08);
      border-left: 3px solid var(--gold);
      border-radius: 4px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .preview-notice b { color: var(--gold); }
    .no-audio-msg {
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
      text-align: center;
      padding: 8px 0;
    }

    /* ── LANDMARKS LIST ── */
    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .landmarks-list { margin-bottom: 28px; }
    .landmark-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: var(--card);
      border-radius: 10px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
    }
    .landmark-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--gold);
      flex-shrink: 0;
    }
    .landmark-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }
    .landmark-lock {
      margin-left: auto;
      font-size: 14px;
      opacity: 0.4;
    }
    .landmark-item.first .landmark-num { background: var(--orange); color: #fff; }
    .landmark-item.first .landmark-lock { display: none; }

    /* ── CTA SECTION ── */
    .cta-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      margin-bottom: 24px;
    }
    .cta-icon  { font-size: 36px; margin-bottom: 12px; }
    .cta-title { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
    .cta-desc  { font-size: 14px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }

    .open-in-app-btn {
      display: block;
      background: var(--orange);
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      padding: 15px 24px;
      border-radius: 12px;
      margin-bottom: 12px;
      transition: background 0.2s;
    }
    .open-in-app-btn:hover { background: #ff8555; }

    .store-badges {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .store-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1a3a5a;
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .store-btn:hover { background: var(--border); }
    .store-btn svg  { width: 18px; height: 18px; fill: var(--text); }

    /* ── FOOTER ── */
    .page-footer {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      margin-top: 8px;
    }
    .page-footer a { color: var(--gold); text-decoration: none; }

    /* ── LOADING / ERROR STATES ── */
    .state-box {
      text-align: center;
      padding: 60px 20px;
    }
    .state-box .icon  { font-size: 48px; margin-bottom: 16px; }
    .state-box .title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .state-box .desc  { font-size: 14px; color: var(--muted); }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- Top Navigation -->
<div class="topbar">
  <span class="topbar-logo">🏛️</span>
  <div>
    <div class="topbar-brand">URBAN TALES</div>
    <div class="topbar-sub">AI AUDIO GUIDE</div>
  </div>
</div>

<!-- Dynamic content target -->
<div id="root">
  <div class="page">
    <div class="state-box">
      <div class="spinner"></div>
      <div class="title">Loading tour…</div>
    </div>
  </div>
</div>

<script>
const API_BASE = 'https://friendly-fulfillment-production.up.railway.app';

function getTourId() {
  const params = new URLSearchParams(window.location.search);
  return params.get('id');
}

async function loadTour(id) {
  const res = await fetch(`${API_BASE}/api/tours/${id}/public`);
  if (!res.ok) throw new Error(res.status === 404 ? 'not_found' : 'error');
  return res.json();
}

function formatType(t) {
  if (!t) return '';
  const map = { '7_wonders': '7 Wonders', full_day: 'Full-Day', half_day: 'Half-Day', custom: 'Custom', multi_day: 'Multi-Day' };
  return map[t] || t.replace(/_/g, ' ');
}

// Per-language UI strings for the tour page
const PAGE_STRINGS = {
  en: {
    audioLabel:   '🎧 Audio Preview',
    previewNotice: '<b>This is a preview.</b> The full story for every landmark is waiting in the app — download Urban Tales to hear them all.',
    audioAlt:     '🎧 Audio Stories',
    audioAltDesc: 'Every landmark has an AI-generated audio story — available in the app.',
    landmarks:    'Landmarks on this tour',
    ctaTitle:     'Hear every story for free',
    ctaDesc:      'Download Urban Tales and follow this tour instantly. AI-narrated stories play as you walk.',
    openBtn:      'Open in Urban Tales App',
    by:           'By',
    following:    'following',
  },
  fr: {
    audioLabel:   '🎧 Aperçu Audio',
    previewNotice: '<b>C\'est un aperçu.</b> L\'histoire complète de chaque lieu vous attend dans l\'app — téléchargez Urban Tales pour tout entendre.',
    audioAlt:     '🎧 Histoires Audio',
    audioAltDesc: 'Chaque lieu a une histoire générée par IA — disponible dans l\'app.',
    landmarks:    'Lieux de ce parcours',
    ctaTitle:     'Écoutez chaque histoire gratuitement',
    ctaDesc:      'Téléchargez Urban Tales et suivez ce parcours instantanément. Des histoires IA jouent pendant votre promenade.',
    openBtn:      'Ouvrir dans Urban Tales',
    by:           'Par',
    following:    'abonnés',
  },
  es: {
    audioLabel:   '🎧 Vista Previa de Audio',
    previewNotice: '<b>Esta es una vista previa.</b> La historia completa de cada lugar te espera en la app — descarga Urban Tales para escucharlas todas.',
    audioAlt:     '🎧 Historias de Audio',
    audioAltDesc: 'Cada lugar tiene una historia generada por IA — disponible en la app.',
    landmarks:    'Lugares de este recorrido',
    ctaTitle:     'Escucha cada historia gratis',
    ctaDesc:      'Descarga Urban Tales y sigue este recorrido al instante. Historias narradas por IA mientras caminas.',
    openBtn:      'Abrir en Urban Tales',
    by:           'Por',
    following:    'seguidores',
  },
  de: {
    audioLabel:   '🎧 Audiovorschau',
    previewNotice: '<b>Dies ist eine Vorschau.</b> Die vollständige Geschichte für jedes Wahrzeichen wartet in der App — lade Urban Tales herunter.',
    audioAlt:     '🎧 Audio-Geschichten',
    audioAltDesc: 'Jedes Wahrzeichen hat eine KI-generierte Audiogeschichte — verfügbar in der App.',
    landmarks:    'Sehenswürdigkeiten dieser Tour',
    ctaTitle:     'Jede Geschichte kostenlos hören',
    ctaDesc:      'Lade Urban Tales herunter und folge dieser Tour sofort. KI-Geschichten spielen während des Spazierens.',
    openBtn:      'In Urban Tales öffnen',
    by:           'Von',
    following:    'Folgende',
  },
  'pt-BR': {
    audioLabel:   '🎧 Prévia de Áudio',
    previewNotice: '<b>Esta é uma prévia.</b> A história completa de cada ponto turístico está esperando no app — baixe o Urban Tales para ouvir tudo.',
    audioAlt:     '🎧 Histórias em Áudio',
    audioAltDesc: 'Cada ponto turístico tem uma história gerada por IA — disponível no app.',
    landmarks:    'Pontos turísticos deste passeio',
    ctaTitle:     'Ouça cada história de graça',
    ctaDesc:      'Baixe o Urban Tales e siga este passeio instantaneamente. Histórias narradas por IA enquanto você caminha.',
    openBtn:      'Abrir no Urban Tales',
    by:           'Por',
    following:    'seguidores',
  },
};

function buildPage(tour) {
  const lms = tour.landmarks_preview || [];
  const deepLink = `urbantales://tour?id=${tour._id}`;
  const pageUrl  = window.location.href;
  const hasAudio = !!tour.preview_audio_b64;
  const lang = tour.preview_language || 'en';
  const s = PAGE_STRINGS[lang] || PAGE_STRINGS.en;
  const previewLandmark = tour.preview_landmark || lms[0]?.name || tour.city;

  // Set page language
  document.documentElement.lang = lang;

  // Update OG tags
  document.title = `${tour.name} — Urban Tales`;
  document.querySelector('[property="og:title"]')?.setAttribute('content', `${tour.name} in ${tour.city} — Urban Tales`);
  document.querySelector('[property="og:description"]')?.setAttribute('content', `Explore ${lms.length} landmarks in ${tour.city} with AI-powered audio stories.`);
  document.querySelector('[property="og:url"]')?.setAttribute('content', pageUrl);

  // Landmark rows
  const landmarkRows = lms.map((lm, i) => `
    <div class="landmark-item ${i === 0 ? 'first' : ''}">
      <div class="landmark-num">${lm.order || i + 1}</div>
      <div class="landmark-name">${lm.name}</div>
      <span class="landmark-lock">🔒</span>
    </div>
  `).join('');

  // Audio player section
  let audioSection = '';
  if (hasAudio) {
    audioSection = `
      <div class="preview-card">
        <div class="preview-label">${s.audioLabel}</div>
        <div class="audio-player-row">
          <button class="play-btn" id="playBtn" title="Play preview">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div class="audio-info">
            <div class="audio-title">${previewLandmark}</div>
            <div class="audio-progress"><div class="audio-progress-fill" id="progressFill"></div></div>
            <div class="audio-time" id="audioTime">0:00</div>
          </div>
        </div>
        <div class="preview-notice">${s.previewNotice}</div>
      </div>
    `;
  } else {
    audioSection = `
      <div class="preview-card">
        <div class="preview-label">${s.audioAlt}</div>
        <div class="no-audio-msg">${s.audioAltDesc}</div>
      </div>
    `;
  }

  document.getElementById('root').innerHTML = `
    <div class="hero-strip">
      <div class="hero-city">${tour.city}</div>
      <div class="hero-title">${tour.name}</div>
      <div class="hero-meta">
        <div class="hero-badge"><span>${lms.length}</span> Landmarks</div>
        <div class="hero-badge"><span>${formatType(tour.tour_type)}</span></div>
        ${tour.followed_count > 0 ? `<div class="hero-badge"><span>${tour.followed_count}</span> ${s.following}</div>` : ''}
      </div>
      ${tour.creator_display_name ? `<p class="creator-tag" style="margin-top:10px">${s.by} <b>${tour.creator_display_name}</b></p>` : ''}
    </div>

    <div class="page">
      ${audioSection}

      <div class="landmarks-list">
        <div class="section-label">${s.landmarks}</div>
        ${landmarkRows}
      </div>

      <div class="cta-section">
        <div class="cta-icon">📱</div>
        <div class="cta-title">${s.ctaTitle}</div>
        <div class="cta-desc">${s.ctaDesc}</div>
        <a href="${deepLink}" class="open-in-app-btn">
          ${s.openBtn}
        </a>
        <div class="store-badges">
          <a href="https://apps.apple.com/app/id6744036049" class="store-btn" target="_blank">
            <svg viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
            App Store
          </a>
          <a href="https://play.google.com/store/apps/details?id=com.urbantales.app" class="store-btn" target="_blank">
            <svg viewBox="0 0 24 24"><path d="M3.18 23.76c.28.15.6.15.88.02l11.65-6.64-2.55-2.55L3.18 23.76zm-1.14-20.2C1.73 3.93 1.5 4.35 1.5 4.89v14.22c0 .54.23.96.54 1.32l.06.06 7.97-7.97v-.19L2.04 3.56zm16.84 8.73l-2.25-1.28-2.84 2.84 2.84 2.84 2.26-1.29c.64-.37.64-.97 0-1.34l-.01.03zM4.07.25l12.89 7.34-2.55 2.55L4.07.25z"/></svg>
            Google Play
          </a>
        </div>
      </div>

      <div class="page-footer">
        <p>© 2025 Urban Tales &nbsp;·&nbsp; <a href="https://urbantales.net">urbantales.net</a> &nbsp;·&nbsp; <a href="https://urbantales.net/privacy">Privacy</a></p>
      </div>
    </div>
  `;

  // Wire up audio player if audio available
  if (hasAudio) {
    setupAudio(tour.preview_audio_b64);
  }
}

function setupAudio(b64) {
  const audio = new Audio(`data:audio/mpeg;base64,${b64}`);
  const playBtn      = document.getElementById('playBtn');
  const progressFill = document.getElementById('progressFill');
  const audioTime    = document.getElementById('audioTime');

  const fmtTime = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = `${pct}%`;
    audioTime.textContent = fmtTime(audio.currentTime);
  });

  audio.addEventListener('ended', () => {
    playBtn.classList.remove('playing');
    playBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
    progressFill.style.width = '0%';
    audioTime.textContent = '0:00';
  });

  playBtn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play();
      playBtn.classList.add('playing');
      playBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
    } else {
      audio.pause();
      playBtn.classList.remove('playing');
      playBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
    }
  });
}

function renderError(type) {
  document.getElementById('root').innerHTML = `
    <div class="page">
      <div class="state-box">
        <div class="icon">${type === 'not_found' ? '🗺️' : '⚠️'}</div>
        <div class="title">${type === 'not_found' ? 'Tour not found' : 'Something went wrong'}</div>
        <div class="desc">${type === 'not_found' ? 'This tour may have been removed or made private.' : 'Please try again in a moment.'}</div>
      </div>
      <div class="page-footer"><a href="https://urbantales.net">← Back to Urban Tales</a></div>
    </div>
  `;
}

(async () => {
  const id = getTourId();
  if (!id) { renderError('not_found'); return; }
  try {
    const tour = await loadTour(id);
    buildPage(tour);
  } catch (e) {
    renderError(e.message === 'not_found' ? 'not_found' : 'error');
  }
})();
</script>
</body>
</html>
